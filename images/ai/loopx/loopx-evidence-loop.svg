<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">LoopX 的证据驱动完成闭环</title>
  <desc id="desc">Agent 的完成建议需要经过验证、证据和类型化状态迁移才会让 Todo 完成；未通过则回到受限执行或等待门禁。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFE"/><stop offset="1" stop-color="#F2F5FB"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#566B83"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1A3550" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="88" y="88" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="42" font-weight="700" fill="#173650">完成不是自报，而是一次被接受的状态迁移</text>
  <text x="90" y="130" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" fill="#62758A">Agent Done ≠ Done：验证、证据与幂等写回构成长期任务的完成语义</text>
  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" filter="url(#shadow)">
    <rect x="100" y="232" width="255" height="120" rx="20" fill="#EAF1FF" stroke="#9DBBEA" stroke-width="2"/>
    <rect x="445" y="232" width="255" height="120" rx="20" fill="#EAF8F4" stroke="#89CDB7" stroke-width="2"/>
    <rect x="790" y="232" width="255" height="120" rx="20" fill="#FFF6E8" stroke="#E8C17C" stroke-width="2"/>
    <rect x="1135" y="232" width="255" height="120" rx="20" fill="#EEF1FA" stroke="#ABB7D2" stroke-width="2"/>
  </g>
  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" text-anchor="middle">
    <text x="228" y="280" font-size="27" font-weight="700" fill="#285887">Agent 提交建议</text>
    <text x="228" y="314" font-size="19" fill="#55718E">完成、失败或阻塞</text>
    <text x="573" y="280" font-size="27" font-weight="700" fill="#1C705B">Verifier 校验</text>
    <text x="573" y="314" font-size="19" fill="#4C7B70">测试 / readback / 规则</text>
    <text x="918" y="280" font-size="27" font-weight="700" fill="#9A5D15">Evidence 固化</text>
    <text x="918" y="314" font-size="19" fill="#8B6B42">结果、引用、时间线</text>
    <text x="1263" y="280" font-size="27" font-weight="700" fill="#46587B">Kernel 接受迁移</text>
    <text x="1263" y="314" font-size="19" fill="#6A7895">幂等写回、审计历史</text>
  </g>
  <g stroke="#566B83" stroke-width="4" marker-end="url(#arrow)">
    <path d="M357 292H434"/><path d="M702 292H779"/><path d="M1047 292H1124"/>
  </g>
  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <rect x="1135" y="474" width="255" height="102" rx="19" fill="#DEF5E9" stroke="#69BE99" stroke-width="2"/>
    <text x="1263" y="518" text-anchor="middle" font-size="28" font-weight="700" fill="#166649">Todo Complete</text>
    <text x="1263" y="550" text-anchor="middle" font-size="18" fill="#4E806F">合法完成并可重放</text>
    <path d="M1263 354V463" stroke="#32866D" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="443" y="474" width="260" height="102" rx="19" fill="#FFF1ED" stroke="#E69B88" stroke-width="2"/>
    <text x="573" y="518" text-anchor="middle" font-size="27" font-weight="700" fill="#A54D3B">未验证 / 条件未满足</text>
    <text x="573" y="550" text-anchor="middle" font-size="18" fill="#93665C">不消耗成功配额</text>
    <path d="M573 354V463" stroke="#B55C4B" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M443 525H250V365" stroke="#B55C4B" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="283" y="463" font-size="18" fill="#986254">修复、补证据或等待 Gate</text>
  </g>
  <rect x="90" y="653" width="1420" height="2" fill="#CCD5E1"/>
  <text x="90" y="704" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="600" fill="#304C66">配额结算原则：只有经过验证、成功写回的状态迁移才应消耗执行预算。</text>
</svg>
