<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1240" height="560" fill="#f7f9fc" rx="12"/><text x="620.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">新「发起 MR」节点与 mr 门禁：交付必须有真正指向目标分支的 MR（#717 → PR #967）</text><rect x="60" y="90" width="118" height="74" rx="12" fill="#ffffff" stroke="#5e6d82" stroke-width="1.3"/><text x="119.0" y="120" font-size="13" fill="#5e6d82" font-weight="600" text-anchor="middle">需求确认</text><line x1="178" y1="127.0" x2="190" y2="127.0" stroke="#5e6d82" stroke-width="1.5"/><text x="184.0" y="121.0" font-size="14" fill="#5e6d82" font-weight="400" text-anchor="middle">→</text><rect x="190" y="90" width="118" height="74" rx="12" fill="#ffffff" stroke="#5e6d82" stroke-width="1.3"/><text x="249.0" y="120" font-size="13" fill="#5e6d82" font-weight="600" text-anchor="middle">方案设计</text><line x1="308" y1="127.0" x2="320" y2="127.0" stroke="#5e6d82" stroke-width="1.5"/><text x="314.0" y="121.0" font-size="14" fill="#5e6d82" font-weight="400" text-anchor="middle">→</text><rect x="320" y="90" width="118" height="74" rx="12" fill="#ffffff" stroke="#5e6d82" stroke-width="1.3"/><text x="379.0" y="120" font-size="13" fill="#5e6d82" font-weight="600" text-anchor="middle">开发实现</text><line x1="438" y1="127.0" x2="450" y2="127.0" stroke="#5e6d82" stroke-width="1.5"/><text x="444.0" y="121.0" font-size="14" fill="#5e6d82" font-weight="400" text-anchor="middle">→</text><rect x="450" y="90" width="118" height="74" rx="12" fill="#ffffff" stroke="#5e6d82" stroke-width="1.3"/><text x="509.0" y="120" font-size="13" fill="#5e6d82" font-weight="600" text-anchor="middle">独立评审</text><line x1="568" y1="127.0" x2="580" y2="127.0" stroke="#5e6d82" stroke-width="1.5"/><text x="574.0" y="121.0" font-size="14" fill="#5e6d82" font-weight="400" text-anchor="middle">→</text><rect x="580" y="90" width="118" height="74" rx="12" fill="#ffffff" stroke="#5e6d82" stroke-width="1.3"/><text x="639.0" y="120" font-size="13" fill="#5e6d82" font-weight="600" text-anchor="middle">测试验证</text><line x1="639.0" y1="164" x2="639.0" y2="186" stroke="#5e6d82" stroke-width="1.5"/><line x1="639.0" y1="186" x2="119.0" y2="188" stroke="#5e6d82" stroke-width="1.5"/><line x1="119.0" y1="188" x2="119.0" y2="210" stroke="#5e6d82" stroke-width="1.5"/><rect x="60" y="210" width="118" height="74" rx="12" fill="#e6f7f1" stroke="#00a870" stroke-width="1.3"/><text x="119.0" y="240" font-size="13" fill="#00a870" font-weight="600" text-anchor="middle">人工验收</text><line x1="178" y1="247.0" x2="190" y2="247.0" stroke="#5e6d82" stroke-width="1.5"/><text x="184.0" y="241.0" font-size="14" fill="#5e6d82" font-weight="400" text-anchor="middle">→</text><rect x="190" y="210" width="118" height="74" rx="12" fill="#e8f0ff" stroke="#0052d9" stroke-width="2"/><text x="249.0" y="240" font-size="13" fill="#0052d9" font-weight="700" text-anchor="middle">发起 MR</text><text x="249.0" y="262" font-size="10.5" fill="#0052d9" font-weight="600" text-anchor="middle">新增</text><line x1="308" y1="247.0" x2="320" y2="247.0" stroke="#5e6d82" stroke-width="1.5"/><text x="314.0" y="241.0" font-size="14" fill="#5e6d82" font-weight="400" text-anchor="middle">→</text><rect x="320" y="210" width="118" height="74" rx="12" fill="#e8f0ff" stroke="#0052d9" stroke-width="2"/><text x="379.0" y="240" font-size="13" fill="#0052d9" font-weight="700" text-anchor="middle">mr 门禁</text><text x="379.0" y="262" font-size="10.5" fill="#0052d9" font-weight="600" text-anchor="middle">新增</text><line x1="438" y1="247.0" x2="450" y2="247.0" stroke="#5e6d82" stroke-width="1.5"/><text x="444.0" y="241.0" font-size="14" fill="#5e6d82" font-weight="400" text-anchor="middle">→</text><rect x="450" y="210" width="118" height="74" rx="12" fill="#ffffff" stroke="#6f5bd6" stroke-width="1.3"/><text x="509.0" y="240" font-size="13" fill="#6f5bd6" font-weight="600" text-anchor="middle">交付汇总</text><rect x="60" y="350" width="1120" height="150" rx="14" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2"/><text x="84" y="380" font-size="12.5" fill="#1f2d3d" font-weight="600" text-anchor="start">为什么重要：此前 交付汇总 自身 push/开 PR，SOP 成功但改动可能留在工作区、随即被回收而丢失（Issue #717“代码丢失”）。</text><text x="84" y="408" font-size="12.5" fill="#1f2d3d" font-weight="400" text-anchor="start">新机制：发起 MR 节点提交工作分支→推送→对运行目标分支开 MR，并写入 mr-body.md（链接/分支/commit SHA）。mr 门禁对每个可写仓库校验：</text><text x="84" y="432" font-size="12.5" fill="#1f2d3d" font-weight="400" text-anchor="start">工作分支在 origin 上相对目标分支有领先提交，且存在 head 等于推送 tip 的 MR（open 或 merged）。校验跑在 GitHub（Git token）与工蜂 Gongfeng（MCP）上，查不到则转人工。</text><text x="84" y="462" font-size="12.5" fill="#5e6d82" font-weight="400" text-anchor="start">配套：命令注入 AGENTFLOW_WORK_BRANCHES / AGENTFLOW_WORK_BRANCH / AGENTFLOW_BASE_BRANCH；交付汇总不再自行 push/开 PR。</text><rect x="84" y="480" width="575" height="24" rx="12.0" fill="#fdf1e7" stroke="#e37318" stroke-width="1"/><text x="371.5" y="498" font-size="12" fill="#e37318" font-weight="600" text-anchor="middle">位于 Unreleased（0.3.10 候选）；#717 仍 OPEN 待发布后关闭</text></svg>