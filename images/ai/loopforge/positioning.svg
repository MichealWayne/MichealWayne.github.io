<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6d82"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0052d9"/></marker></defs><rect width="1240" height="640" fill="#f7f9fc" rx="12"/><text x="620.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">定位四象限：LoopForge 占据「团队流程治理 × 研发交付专用」区</text><line x1="120" y1="330" x2="1120" y2="330" stroke="#d9e2ec" stroke-width="2" marker-end="url(#arr)"/><line x1="620" y1="580" x2="620" y2="70" stroke="#d9e2ec" stroke-width="2" marker-end="url(#arr)"/><text x="1120" y="360" font-size="12.5" fill="#5e6d82" font-weight="400" text-anchor="end">单次编码能力 →</text><text x="120" y="360" font-size="12.5" fill="#5e6d82" font-weight="400" text-anchor="start">← 团队流程治理</text><text x="634" y="84" font-size="12.5" fill="#5e6d82" font-weight="400" text-anchor="start">通用/跨领域 ↑</text><text x="634" y="576" font-size="12.5" fill="#5e6d82" font-weight="400" text-anchor="start">↓ 研发交付专用</text><circle cx="900" cy="470" r="6" fill="#5e6d82" stroke="#fff" stroke-width="2"/><text x="914" y="474" font-size="12" fill="#5e6d82" font-weight="600" text-anchor="start">Claude Code / Codex / CodeBuddy</text><text x="914" y="490" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">编码执行器（LoopForge 的下游）</text><circle cx="820" cy="380" r="6" fill="#5e6d82" stroke="#fff" stroke-width="2"/><text x="834" y="384" font-size="12" fill="#5e6d82" font-weight="600" text-anchor="start">Cursor / Copilot</text><text x="834" y="400" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">IDE 内编码助手</text><circle cx="430" cy="470" r="6" fill="#00a870" stroke="#fff" stroke-width="2"/><text x="444" y="474" font-size="12" fill="#00a870" font-weight="600" text-anchor="start">OpenHands</text><text x="444" y="490" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">Agent Server + 自动化，部分交叉</text><circle cx="400" cy="300" r="6" fill="#00a870" stroke="#fff" stroke-width="2"/><text x="414" y="304" font-size="12" fill="#00a870" font-weight="600" text-anchor="start">LoopX</text><text x="414" y="320" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">长程 Goal 控制面（通用目标）</text><circle cx="640" cy="320" r="6" fill="#6f5bd6" stroke="#fff" stroke-width="2"/><text x="654" y="324" font-size="12" fill="#6f5bd6" font-weight="600" text-anchor="start">DeepSeek Harness</text><text x="654" y="340" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">插件优先 Agent Runtime</text><circle cx="300" cy="180" r="6" fill="#e37318" stroke="#fff" stroke-width="2"/><text x="314" y="184" font-size="12" fill="#e37318" font-weight="600" text-anchor="start">Temporal</text><text x="314" y="200" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">通用持久化 Workflow 基础设施</text><circle cx="560" cy="150" r="6" fill="#e37318" stroke="#fff" stroke-width="2"/><text x="574" y="154" font-size="12" fill="#e37318" font-weight="600" text-anchor="start">Dify / n8n / Flowise</text><text x="574" y="170" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">通用业务流编排</text><circle cx="360" cy="350" r="6" fill="#00a870" stroke="#fff" stroke-width="2"/><text x="374" y="354" font-size="12" fill="#00a870" font-weight="600" text-anchor="start">Multica 类任务平台</text><text x="374" y="370" font-size="10.5" fill="#5e6d82" font-weight="400" text-anchor="start">Agent 任务生命周期/看板</text><rect x="150" y="440" width="250" height="100" rx="12" fill="#e8f0ff" stroke="#0052d9" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="172" cy="466" r="9" fill="#0052d9" stroke="#fff" stroke-width="2"/><text x="190" y="471" font-size="13" fill="#0052d9" font-weight="700" text-anchor="start">LoopForge 主战场</text><text x="275" y="496" font-size="11" fill="#5e6d82" font-weight="400" text-anchor="middle">固定研发交付流程 × 质量门禁</text><text x="275" y="514" font-size="11" fill="#5e6d82" font-weight="400" text-anchor="middle">× 人工签字 × 交付追溯</text><rect x="120" y="600" width="303.5" height="23.5" rx="11.75" fill="#fdf1e7" stroke="#e37318" stroke-width="1"/><text x="271.75" y="617.5" font-size="11.5" fill="#e37318" font-weight="600" text-anchor="middle">定位对比为分析判断（D 级），非同口径跑分结果</text></svg>