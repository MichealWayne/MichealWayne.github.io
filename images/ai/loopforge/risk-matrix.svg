t><rect x="60" y="302" width="70" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="130" y="302" width="470" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="600" y="302" width="620" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="70" y="312" width="50" height="28" rx="14" fill="#fdf1e7" stroke="#e37318" stroke-width="1"/><text x="95" y="331" font-size="12.5" fill="#e37318" font-weight="700" text-anchor="middle">P1</text><text x="144" y="332" font-size="12.5" fill="#1f2d3d" font-weight="600" text-anchor="start">自动 Retry/合流造成错误变更或成本失控</text><text x="614" y="332" font-size="12" fill="#1f2d3d" font-weight="400" text-anchor="start">重试与 Token 预算 · 可逆合入 · 人类最终签字</text><rect x="60" y="350" width="70" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="130" y="350" width="470" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="600" y="350" width="620" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="70" y="360" width="50" height="28" rx="14" fill="#fdf1e7" stroke="#e37318" stroke-width="1"/><text x="95" y="379" font-size="12.5" fill="#e37318" font-weight="700" text-anchor="middle">P1</text><text x="144" y="380" font-size="12.5" fill="#1f2d3d" font-weight="600" text-anchor="start">企业系统适配不足（GitLab/TAPD/SSO/IM）</text><text x="614" y="380" font-size="12" fill="#1f2d3d" font-weight="400" text-anchor="start">按边界逐一验收；跟踪 #128/#160 进展</text><rect x="60" y="398" width="70" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="130" y="398" width="470" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="600" y="398" width="620" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="70" y="408" width="50" height="28" rx="14" fill="#fdf1e7" stroke="#e37318" stroke-width="1"/><text x="95" y="427" font-size="12.5" fill="#e37318" font-weight="700" text-