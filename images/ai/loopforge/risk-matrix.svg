<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1240" height="500" fill="#f7f9fc" rx="12"/><text x="620.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">实施前风险矩阵（P0 不解决不推广）</text><rect x="60" y="70" width="70" height="40" rx="0" fill="#edf1f7" stroke="#d9e2ec" stroke-width="1"/><text x="74" y="96" font-size="13" fill="#1f2d3d" font-weight="700" text-anchor="start">级别</text><rect x="130" y="70" width="470" height="40" rx="0" fill="#edf1f7" stroke="#d9e2ec" stroke-width="1"/><text x="144" y="96" font-size="13" fill="#1f2d3d" font-weight="700" text-anchor="start">风险</text><rect x="600" y="70" width="620" height="40" rx="0" fill="#edf1f7" stroke="#d9e2ec" stroke-width="1"/><text x="614" y="96" font-size="13" fill="#1f2d3d" font-weight="700" text-anchor="start">实施前最低动作</text><rect x="60" y="110" width="70" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="130" y="110" width="470" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="600" y="110" width="620" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="70" y="120" width="50" height="28" rx="14" fill="#fdecea" stroke="#d54941" stroke-width="1"/><text x="95" y="139" font-size="12.5" fill="#d54941" font-weight="700" text-anchor="middle">P0</text><text x="144" y="140" font-size="12.5" fill="#1f2d3d" font-weight="600" text-anchor="start">Docker Socket = 宿主 Daemon 控制权</text><text x="614" y="140" font-size="12" fill="#1f2d3d" font-weight="400" text-anchor="start">专用可信主机 · 最小网络域 · 独立 Runner/沙箱评估</text><rect x="60" y="158" width="70" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="130" y="158" width="470" height="48" rx="0" fill="#ffffff" stroke="#d9e2ec" stroke-width="1"/><rect x="600" y="158" width="620" height="48" rx="0" fill="#ffffff" stroke="#d9